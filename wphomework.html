<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<title>캐릭터 숙제 체크표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef1f6;--pn:#fff;--tx:#1c2433;--mu:#6b7589;--ln:#d8dee9;--todo:#e5484d;--todo-t:#fff;--done:#7cc65a;--done-t:#25451a;--na:#e4e8ef;--na-l:#d3d9e4;--hd:#1f2d4a;--hd-t:#fff;--ac:#e9b92f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--pn:#182030;--tx:#e6ebf5;--mu:#8e9ab0;--ln:#2c3750;--todo:#d23b40;--done:#4f9a3a;--done-t:#eaf6e4;--na:#222c40;--na-l:#2c3750;--hd:#0b1020;}}
:root[data-theme="dark"]{--bg:#10151f;--pn:#182030;--tx:#e6ebf5;--mu:#8e9ab0;--ln:#2c3750;--todo:#d23b40;--done:#4f9a3a;--done-t:#eaf6e4;--na:#222c40;--na-l:#2c3750;--hd:#0b1020}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px}
header{padding:16px 16px 8px}
h1{font-size:20px;margin:0}
.ttl{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.ttl button{border:1px solid var(--ln);background:var(--pn);color:var(--tx);border-radius:6px;padding:4px 10px;font-size:13px}
.ttl button:hover{border-color:var(--todo)}
#lk{display:inline-flex;align-items:center;gap:5px}
.ttl button.on{background:var(--ac);border-color:var(--ac);color:#2a2000}
.hr{display:flex;align-items:center;justify-content:center}
.hr .hi{flex:1;min-width:0}
.rb{border:1px solid #ffffff77;background:#ffffff26;color:inherit;border-radius:3px;font-size:9px;line-height:12px;padding:0 3px;margin-left:3px;flex:none}
.rb:hover{background:var(--ac);color:#2a2000;border-color:var(--ac)}
.sub{color:var(--mu);font-size:13px}
.bar{height:8px;background:var(--na);border-radius:4px;margin:10px 0;overflow:hidden}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px;margin:10px 0;max-width:760px}
.pl{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}
.pl b{color:var(--tx);font-weight:500}
.pg .bar{margin:4px 0 0}
td.nm.dn{background:var(--done);color:var(--done-t)}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .2s}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:inherit;cursor:pointer}
.tools button,.tools label{border:1px solid var(--ln);background:var(--pn);color:var(--tx);border-radius:6px;padding:6px 10px;font-size:13px}
.tools button:hover{border-color:var(--todo)}
.tools button.on{background:var(--ac);border-color:var(--ac);color:#2a2000}
.tools input[type=text]{border:1px solid var(--ln);background:var(--pn);color:var(--tx);border-radius:6px;padding:6px 8px;font:inherit;width:120px}
.legend{display:flex;gap:12px;color:var(--mu);font-size:12px;margin-top:8px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;background:var(--c)}
.wrap{max-width:100%;overflow:auto;margin:8px 0 24px;max-height:calc(100vh - 220px);min-height:320px}
table{border-collapse:separate;border-spacing:0;margin:0 auto 0 16px;background:var(--pn)}
th,td{border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);text-align:center;padding:0}
th{background:var(--hd);color:var(--hd-t);font-weight:500;font-size:12px;line-height:1.25;padding:6px 4px;min-width:52px;position:sticky;white-space:normal;word-break:keep-all}
thead tr:first-child th{top:0;z-index:3;height:32px}
thead tr:nth-child(2) th{top:32px;z-index:3}
:root{--g0:#5a5f6b;--g1:#3a4f7d;--g2:#6b4f8a;--g3:#2f7a74;--g4:#9a6a2a;--g5:#8a3f55;--g6:#4f6f2f;}
th.g0{background:var(--g0)}th.g1{background:var(--g1)}th.g2{background:var(--g2)}th.g3{background:var(--g3)}th.g4{background:var(--g4)}th.g5{background:var(--g5)}th.g6{background:var(--g6)}
th.i0{background:color-mix(in srgb,var(--g0) 38%,var(--pn));color:var(--tx)}th.i1{background:color-mix(in srgb,var(--g1) 38%,var(--pn));color:var(--tx)}th.i2{background:color-mix(in srgb,var(--g2) 38%,var(--pn));color:var(--tx)}th.i3{background:color-mix(in srgb,var(--g3) 38%,var(--pn));color:var(--tx)}th.i4{background:color-mix(in srgb,var(--g4) 38%,var(--pn));color:var(--tx)}th.i5{background:color-mix(in srgb,var(--g5) 38%,var(--pn));color:var(--tx)}th.i6{background:color-mix(in srgb,var(--g6) 38%,var(--pn));color:var(--tx)}
th.gs,td.gs{border-left:3px solid var(--mu)}
thead tr:nth-child(2) .hi{color:var(--tx);background:var(--pn);border-color:var(--ln)}
th.nm,td.nm{position:sticky;left:0;z-index:2;text-align:left;min-width:104px;padding:0 8px;background:var(--pn);font-weight:500;white-space:nowrap}
th.nm{background:var(--hd);z-index:4}
td.c{width:52px;height:24px}
td button.cell{width:100%;height:100%;min-height:24px;border:0;background:var(--na);padding:0;font-size:12px}
td button.cell.T{background:var(--todo);color:var(--todo-t)}
td button.cell.P{background:repeating-linear-gradient(45deg,#f59f00,#f59f00 6px,#ffc247 6px,#ffc247 12px);color:#3a2500}
td button.cell.P::after{content:"…";font-weight:700}
td button.cell.dt::after{content:none}
td button.cell.D{background:var(--done);color:var(--done-t)}
td button.cell.D::after{content:"✓";font-weight:700}
td button.cell.N{background:repeating-linear-gradient(45deg,var(--na),var(--na) 4px,var(--na-l) 4px,var(--na-l) 5px);cursor:default}
.edit td button.cell.N{cursor:pointer}
button.cell:focus-visible,.tools button:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}
.del{border:0;background:none;color:var(--mu);float:right;font-size:16px;padding:0 0 0 6px;display:none}
.edit .del{display:inline;float:none;font-size:16px;line-height:1;margin-left:2px}
td.nm{font-size:12px;height:24px;line-height:1.2}
.ni{width:84px;height:20px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:5px;padding:0 6px;font:inherit;font-size:13px}
.hi{width:100%;min-width:44px;height:22px;border:1px solid #ffffff55;background:#ffffff22;color:var(--hd-t);border-radius:4px;padding:0 2px;font:inherit;font-size:11px;text-align:center}
tr.dv td{border-bottom:3px solid var(--mu)}
.mv.on{color:var(--ac);font-weight:700}
.dg{display:inline-block;cursor:grab;color:var(--mu);user-select:none;-webkit-user-select:none;touch-action:none;padding:0 3px;font-size:15px;line-height:1;flex:none}
.dg:active{cursor:grabbing}
tr.dragging,th.dragging{opacity:.45}
tr.dt-up td{box-shadow:inset 0 3px 0 var(--ac)}
tr.dt-dn td{box-shadow:inset 0 -3px 0 var(--ac)}
th.dt-l{box-shadow:inset 4px 0 0 var(--ac)}
th.dt-r{box-shadow:inset -4px 0 0 var(--ac)}
.al{margin:8px 0 0;padding:8px 12px;border-radius:8px;font-size:13px;max-width:760px}
.al.warn{background:color-mix(in srgb,#f59f00 24%,var(--pn));border:1px solid #f59f00}
.al.ok{background:color-mix(in srgb,var(--done) 26%,var(--pn));border:1px solid var(--done)}
.dd{font-style:normal;font-size:11px;padding:0 6px;border-radius:8px;background:var(--na);color:var(--mu);margin-left:5px}
.dd.d1{background:#ffd8a8;color:#7a3a00}
.dd.d0{background:#e8590c;color:#fff;font-weight:700}
th.g2.dl,th.g3.dl{background:#e8590c}
.bd{background:#fff;color:#e8590c;font-size:10px;line-height:14px;padding:0 5px;border-radius:7px;margin-left:5px;font-weight:700;flex:none}
td.dl button.cell.P,td.dl button.cell.T{box-shadow:inset 0 0 0 2px #ffd43b}
.hb.on{background:#f59f00;border-color:#f59f00;color:#2a1a00}
.hb.au{flex:none;white-space:nowrap}
.ao{margin-left:4px;font-size:12px;flex:none}
.hb:disabled{opacity:.35;cursor:default}
.rb.ab{font-size:12px;font-weight:700;line-height:12px}
.lk button.cell{cursor:not-allowed}
.lk .rb{opacity:.4;cursor:not-allowed}
.need{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:8px 0;padding:10px 14px;border-radius:8px;background:#d9480f;color:#fff;font-size:14px;max-width:760px}
.need[hidden]{display:none}
.need button{border:0;border-radius:6px;padding:6px 12px;background:#fff;color:#b23b0b;font-weight:700}
body.fneed #wrap{opacity:.5;pointer-events:none}
body.fneed #ed,body.fneed #lk{opacity:.5}
.fsrow{padding:0 16px 10px}
.mi{border:0;background:none;color:var(--mu);padding:0 3px 0 0;vertical-align:middle;display:inline-flex;align-items:center;cursor:pointer;flex:none}
.mi:hover{color:var(--tx)}
.mi.has{color:#e0a100}
.mi.has svg path:first-child{fill:currentColor;fill-opacity:.28}
th.nm .mi{color:#c9d3ea}th.nm .mi.has{color:#ffd43b}
body.fneed #wrap .mi{pointer-events:auto}
.mm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.mm[hidden]{display:none}
.mp{background:var(--pn);color:var(--tx);border-radius:10px;width:100%;max-width:960px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.mp.sm{max-width:480px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--ln)}
.mh button,.mxb{border:1px solid var(--ln);background:var(--pn);color:var(--tx);border-radius:6px;padding:4px 10px;font-size:13px}
.mh button:disabled,.mxb:disabled{opacity:.4;cursor:default}
#mbody{padding:12px 14px;overflow:auto}
#mta{width:100%;min-height:220px;resize:vertical;box-sizing:border-box;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:6px;padding:8px;font:inherit;font-size:14px}
.mnote{margin-top:8px;color:var(--mu);font-size:12px}
.mg{display:grid;width:100%;align-items:stretch;border-top:1px solid var(--ln);border-left:1px solid var(--ln)}
.mgh{background:var(--hd);color:var(--hd-t);font-weight:500;font-size:12px;padding:4px 6px;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:center}
.mgh.mgn0{position:sticky;left:0;z-index:3}
.mgc{border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);display:flex;align-items:stretch;min-height:28px;background:var(--pn)}
.mgc.mgn{font-size:12px;font-weight:500;padding:0 8px;align-items:center;white-space:nowrap;position:sticky;left:0;z-index:1}
.mgh .mxb.sm{flex:none;color:var(--tx)}
.mci{width:100%;min-width:0;background:#ffffff22;border:1px solid #ffffff55;color:var(--hd-t);border-radius:4px;padding:1px 4px;font:inherit;font-size:12px;text-align:center}
.mc{width:100%;height:28px;box-sizing:border-box;border:0;background:transparent;color:var(--tx);padding:5px 6px;font:inherit;font-size:13px;line-height:18px;resize:none;overflow:hidden}
.mc:focus{outline:2px solid var(--ac);outline-offset:-2px;background:var(--bg)}
.mxb.sm{font-size:11px;padding:0 6px;margin:2px;line-height:22px;align-self:center}
.off{opacity:.4}
.hb{display:inline-block;margin:2px 1px 0;border:1px solid var(--ln);background:var(--pn);color:var(--tx);border-radius:4px;padding:0 5px;font-size:10px;line-height:16px}
.mv{border:0;background:none;color:var(--mu);padding:0 3px;line-height:1;font-size:12px}
.mv:hover:not(:disabled){color:var(--todo)}
.mv:disabled{opacity:.25;cursor:default}
.note{padding:0 16px 24px;color:var(--mu);font-size:12px}
.hxm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:12px}.hxm[hidden]{display:none}
.hxp{background:var(--bg);color:var(--tx);border-radius:10px;width:100%;max-width:1320px;height:94vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.hxh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--ln);background:var(--pn);border-radius:10px 10px 0 0;flex-wrap:wrap}
.hxh button{border:1px solid var(--ln);background:var(--pn);color:var(--tx);border-radius:6px;padding:4px 10px;font-size:13px}.hxh button.on{background:var(--ac);border-color:var(--ac);color:#2a2000}.hxt{display:flex;gap:6px}
.hxb{overflow:auto;flex:1;min-height:0}.hxb [hidden]{display:none}
</style>
</head>
<body>
<header>
<div class="ttl"><h1>캐릭터 숙제 체크표</h1><button id="ed">편집 모드</button><button id="lk" aria-pressed="false" title="체크 잠그기"></button><button id="hp">❓ 도움말</button><button id="fnew">📁 새 파일로 연결</button><button id="fopen">📂 기존 파일 연결</button><button id="frec" hidden>🔄 다시 연결</button><span class="sub" id="fs"></span></div>
<div id="need" class="need" hidden><b>⚠ 데이터 파일 연결이 필요해요</b><span id="nmsg"></span><button id="nrec" hidden>🔄 다시 연결</button><button id="nnew">📁 새 파일로 연결</button><button id="nopen">📂 기존 파일 연결</button></div>
<div class="sub" id="sub"></div>
<div id="alerts"></div>
<div class="bars" id="bars"></div>
<div class="tools">

</div>
<div class="legend"><span style="--c:var(--todo)">미완료</span><span style="--c:var(--done)">완료</span><span style="--c:#f59f00">진행중 (우클릭)</span><span style="--c:var(--na-l)">해당 없음</span></div>
</header>
<div class="wrap" id="wrap"><table id="tb"></table></div>
<div class="note">사용법과 각 버튼의 설명은 위쪽의 <b>❓ 도움말</b> 버튼에서 볼 수 있어요.</div>
<div id="hxm" class="hxm" hidden><div class="hxp" role="dialog" aria-modal="true" aria-label="도움말"><div class="hxh"><b>❓ 도움말</b><span class="hxt"><button id="hx1" class="on">화면으로 보기</button><button id="hx2">자세한 설명</button></span><button id="hxc" aria-label="닫기">✕</button></div><div class="hxb"><div id="hxa"></div><div id="hxd" hidden></div></div></div></div>
<div id="mm" class="mm" hidden><div id="mp" class="mp" role="dialog" aria-modal="true" aria-labelledby="mmt"><div class="mh"><b id="mmt"></b><span><button id="mdel">메모 삭제</button> <button id="mclose" aria-label="닫기">✕</button></span></div><div id="mbody"></div></div></div>
<script>
var G=[["이벤트",1],["일일",4],["주간",9],["월간",5],["시즌",2],["쿠폰",1],["제전",5]];
var T=["욕망의숲","룰렛","일퀘","잡화\n검칼","교환소","증표\n상점","파벌\n상점","시틈","결던","유니","세틈","주말","인과돌","광영","광영\n주화","황제\n문장","결던\n상점","수호탑","전설\n주문석","시틈\n상점","유니\n상점","BJ쿠폰","제전1","제전2","제전3","제전4","제전5"];
var START=[["캐릭터1","TTTTTTTTTTTTTTTTTTTTTTTTTTT"],["캐릭터2","TTTTTTTTTTTTTTTTTTTTTTTTTTT"],["캐릭터3","TTTTTTTTTTTTTTTTTTTTTTTTTTT"],["캐릭터4","TTTTTTTTTTTTTTTTTTTTTTTTTTT"],["캐릭터5","TTTTTTTTTTTTTTTTTTTTTTTTTTT"]];
var DS=G.map(function(g){return g[1]}),GI=[],GS={};
function sync(){G.forEach(function(g,i){g[1]=S.sizes[i]});GI=[];GS={};G.forEach(function(g,k){GS[GI.length]=1;for(var n=0;n<g[1];n++)GI.push(k)})}
var APPID="wphomework data";
function idAsk(){return confirm("이 파일에는 '"+APPID+"' 식별 코드가 없어요.\n이 앱에서 만든 파일이 아니거나, 식별 코드가 생기기 전에 쓰던 예전 파일일 수 있어요.\n\n그래도 이 파일을 연결할까요?\n(연결하면 이 파일에 식별 코드가 추가되어 저장돼요)")}
var KEY="hw-checklist-v1",edit=false,S;
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function wk(d){var m=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7));return ymd(m)}
function fresh(){return norm({v:2,rows:START.map(function(r){return{n:r[0],c:r[1]}})})}
function norm(o){o.app=APPID;var it=T.map(function(t){return t.replace('\n',' ')}),gp=G.map(function(g){return g[0]});
if(!o.v){if(o.items&&o.items.length)o.items.unshift(it[0]);if(o.groups&&o.groups.length)o.groups.unshift(gp[0]);o.rows.forEach(function(w){w.c=(/[TDP]/.test(w.c)?"T":".")+w.c});o.v=2}
o.divs=Array.isArray(o.divs)?o.divs:[];
o.lock=!!o.lock;
o.sizes=Array.isArray(o.sizes)&&o.sizes.length===G.length?o.sizes:DS.slice();
var N=o.sizes.reduce(function(a,b){return a+b},0);
o.auto=fit(o.auto,[],G.length,0);o.ark=fit(o.ark,[],G.length,"");o.hid=fit(o.hid,[],N,0);o.pg=fit(o.pg,[],N,0);o.dt=fit(o.dt,[],N,0);o.mcols=Array.isArray(o.mcols)&&o.mcols.length?o.mcols.slice(0,12):["메모"];
o.items=fit(o.items,it,N,"새 항목");o.groups=fit(o.groups,gp,G.length,"분류");
o.rows.forEach(function(w){var c=w.c;while(c.length<N)c+=/[TDP]/.test(w.c)?'T':'.';w.c=c.slice(0,N);w.dv=fit(w.dv,[],N,"");w.dp=fit(w.dp,[],N,"");w.memo=typeof w.memo==="string"?w.memo:"";w.mt=fit(w.mt,[],o.mcols.length,"")});
if(!o.m2){if(o.items[0]==="이벤트")o.items[0]="욕망의숲";o.dt[0]=1;o.rows.forEach(function(w){if(w.c[0]==="D"||w.c[0]==="P")w.c="T"+w.c.slice(1)});o.m2=1}
return o}
function fit(a,d,n,f){a=Array.isArray(a)?a.slice(0,n):[];while(a.length<n)a.push(d[a.length]!==undefined?d[a.length]:f);return a}
function load(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.rows)return norm(o)}}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}pushFile()}
var fNeed=false,fDirty=false,fh=null,fReady=false,fWt=null,fBusy=false,fLen=0,fForce=false,fOK=("showSaveFilePicker" in window&&"showOpenFilePicker" in window),FT=[{description:"JSON 데이터",accept:{"application/json":[".json"]}}];
