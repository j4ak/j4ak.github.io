<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">

<title>휴대폰 사은품 관리</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--sub:#667085;--bd:#e3e6ec;--acc:#2f5bea;--paid:#ffe14d;--paidtx:#4a3b00;--empty:#f0f2f5;--due:#eef2ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161c;--card:#1c2029;--tx:#e8ebf2;--sub:#98a1b3;--bd:#2c3240;--acc:#7d9bff;--paid:#d9b800;--paidtx:#1a1500;--empty:#232834;--due:#252c44}}
:root[data-theme="dark"]{--bg:#13161c;--card:#1c2029;--tx:#e8ebf2;--sub:#98a1b3;--bd:#2c3240;--acc:#7d9bff;--paid:#d9b800;--paidtx:#1a1500;--empty:#232834;--due:#252c44}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
.w{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 12px}.sb{padding:3px 9px;font-size:12.5px}
.warn{--wbg:#fff1dc;--wbd:#f0a03c;--wtx:#7a3d00;background:var(--wbg);border:2px solid var(--wbd);color:var(--wtx);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.warn.err{--wbg:#fde8e8;--wbd:#e05555;--wtx:#7a1010}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{--wbg:#3a2a12;--wbd:#c98a2e;--wtx:#ffd9a0}:root:not([data-theme="light"]) .warn.err{--wbg:#3d1a1a;--wbd:#c85050;--wtx:#ffc2c2}}
:root[data-theme="dark"] .warn{--wbg:#3a2a12;--wbd:#c98a2e;--wtx:#ffd9a0}:root[data-theme="dark"] .warn.err{--wbg:#3d1a1a;--wbd:#c85050;--wtx:#ffc2c2}
.warn span{flex:1;min-width:200px}
.tot{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tot div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px}
.tot b{display:block;font-size:17px}.tot span{color:var(--sub);font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:16px}
.hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start}
.hd h2{margin:0;font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--sub);font-size:12.5px;margin:6px 0 10px}
.meta b{color:var(--tx);font-weight:600}
.bar{height:6px;background:var(--empty);border-radius:4px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--acc)}
.sm{font-size:12.5px;color:var(--sub);margin-bottom:8px}
.sc{overflow-x:auto;border:1px solid var(--bd);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--bd);padding:5px 8px;text-align:center;white-space:nowrap}
th{background:var(--empty);font-weight:600;font-size:12px}
th small{display:block;font-weight:400;color:var(--sub);font-size:10px}
td.n{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;min-width:120px}
td.n small{display:block;color:var(--sub);font-size:11px}
td.x{background:var(--empty)}
td.c{cursor:pointer;user-select:none}
td.c:hover{outline:2px solid var(--acc);outline-offset:-2px}
td.c.p{background:var(--paid);color:var(--paidtx);font-weight:600}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button.dng{color:#d33}
details.card summary{cursor:pointer;font-weight:700;font-size:15px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:12px 0}
label{display:flex;flex-direction:column;font-size:12px;color:var(--sub);gap:3px}
input{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);min-width:0}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;padding:10px;border:1px dashed var(--bd);border-radius:8px;margin-bottom:8px;position:relative}
.hint{color:var(--sub);font-size:12px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;background:var(--empty);color:var(--sub);border-radius:6px;padding:1px 7px;margin-left:6px}
table.sum td,table.sum th{padding:6px 10px}table.sum td.l{text-align:left}
table.sum tfoot td{font-weight:700;background:var(--empty)}
</style></head><body><div class="w">
<div class="top"><h1>📱 휴대폰 사은품 관리</h1><div class="acts" style="align-items:center"><span id="st" class="hint"></span><button class="sb" id="bLink" title="JSON 파일을 한 번 연결하면 이후 변경이 자동으로 파일에 저장됩니다">🔗 JSON 파일 연결</button><button class="sb" id="bBk" title="자동 백업 폴더 · 이전 상태로 되돌리기">🗂 백업</button><button class="sb" id="bSave" title="JSON 파일 내려받기(수동 백업)">💾 내려받기</button><button class="sb" id="bLoad" title="JSON 파일에서 복원">📂 불러오기</button><input type="file" id="fIn" accept=".json,application/json" style="display:none"></div></div>
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;align-items:center;justify-content:center;padding:16px"><div class="card" style="max-width:420px;width:100%;margin:0"><h2 id="mt" style="margin:0 0 8px;font-size:17px"></h2><p id="mb" style="margin:0 0 14px"></p><div class="acts" id="mbtn"></div></div></div>
<div id="bkm" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;align-items:center;justify-content:center;padding:16px"><div class="card" style="max-width:520px;width:100%;margin:0;max-height:90vh;overflow:auto" id="bkc"></div></div>
<div id="warn" class="warn" style="display:none"></div>
<div id="msg" class="card hint" style="display:none"></div>
<div class="tot" id="tot"></div>
<div class="tabs" id="tabs"></div>
<div id="lines"></div>
<details class="card" id="addbox"><summary id="sumt">＋ 회선 추가</summary>
<div class="fg">
<label>번호(전화번호)<input id="f_num" placeholder="010-0000-0000"></label>
<label>통신사<input id="f_car"></label>
<label>사용기기<input id="f_dev"></label>
<label>요금제명<input id="f_plan"></label>
<label>월요금(원)<input id="f_fee" type="number" min="0"></label>
<label>개통일<input id="f_open" type="date"></label>
<label>해지일<input id="f_end" type="date"></label>
<label>프로모션코드<input id="f_promo"></label>
</div>
<div id="gifts"></div>
<button id="addGift">＋ 사은품 추가</button>
<p class="hint">수정 시 기존 지급 체크는 유지됩니다. 사은품의 지급기간·최초지급월을 입력하면 회선별 지급현황 표가 자동으로 만들어집니다.</p>
<button class="pri" id="save">회선 등록</button> <button id="cancel" style="display:none">수정 취소</button>
</details>
<p class="hint" style="text-align:center">버전 2026.10.09-b · 데이터 식별 코드 mobilegift-data</p>
</div>
<script>
var KEY='giftmgr_v1';
function seed(){
 return [{id:'example-1',num:'010-0000-0000 (예시)',car:'예시모바일',dev:'예시폰 15',plan:'예시 요금제 11GB',fee:19800,open:'2026.09.10',end:'2027.03.09',promo:'EXAMPLE2026',
  gifts:[{t:'네이버페이',a:30000,n:6,s:'2026-10',d:'매월 15일경',p:[0]},{t:'상품권',a:10000,n:6,s:'2026-10',d:'매월 말일',p:[]}]}]}
var S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.length)S=seed();
var TS=0,fh=null,fhPend=null,timer=null,fhFail=false,chk=true,pendFn=null,skipLink=false,replaced=false,bk=null,bkPend=null,bkFail=false,bt=null,lastJ=JSON.stringify(S);try{TS=+localStorage.getItem(KEY+'_ts')||0}catch(e){}
var APP_ID='mobilegift-data';
var NOID='<b style="color:#d33">⚠ 이 문서 전용 식별 코드가 없는 파일입니다.</b> 이전 버전에서 저장했거나 다른 용도의 파일일 수 있어요. 연결하면 이후 이 파일에 자동 저장되며 식별 코드가 추가됩니다.<br>';
var FT=[{description:'JSON',accept:{'application/json':['.json']}}];
function setSt(t){var e=document.getElementById('st');if(e)e.textContent=t;updWarn()}
function updWarn(){
 var w=document.getElementById('warn');if(!w)return;
 if(chk||(fh&&!fhFail)){w.style.display='none';return}
 var m,b,c='warn';
 if(fh&&fhFail){c+=' err';m='<b>⚠ 파일 저장에 실패했습니다.</b> <b>'+esc(fh.name)+'</b>에 변경 내용이 기록되지 않고 있어요. (브라우저에는 저장됨)';b='파일 다시 연결'}
 else if(fhPend){m='<b>⚠ 파일 연결이 끊어졌습니다 (연결 대기 중).</b> <b>'+esc(fhPend.name)+'</b>에 자동 저장되지 않고 있어요. 다시 연결을 허용해 주세요.';b='다시 연결'}
 else{m='<b>⚠ JSON 파일이 연결되지 않았습니다.</b> 지금 변경 내용은 이 브라우저에만 저장돼요. 파일을 연결해야 자동으로 파일에 저장됩니다.';b='JSON 파일 연결'}
 w.className=c;w.style.display='';
 w.innerHTML='<span>'+m+'</span><button class="pri" id="wBtn">'+b+'</button>';
 document.getElementById('wBtn').onclick=function(){document.getElementById('bLink').click()}}
function save(){snapBefore();TS=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(KEY+'_ts',TS)}catch(e){}lastJ=JSON.stringify(S);push()}
function push(){
 if(bk){clearTimeout(bt);bt=setTimeout(writeBackup,2000)}
 if(fh){clearTimeout(timer);setSt('저장 중…');timer=setTimeout(writeFile,500)}
 else setSt(fhPend?'🔗 '+fhPend.name+' — 다시 연결 필요':'💾 이 브라우저에만 저장됨')}
async function writeFile(){
 try{var w=await fh.createWritable();await w.write(JSON.stringify({app:APP_ID,version:1,ts:TS,savedAt:new Date(TS).toISOString(),lines:S},null,2));await w.close();fhFail=false;setSt('✅ '+fh.name+' 자동 저장됨')}
 catch(e){fhFail=true;setSt('⚠ 파일 저장 실패 — 🔗로 다시 연결하세요')}}
function applyData(a,ts){var nj=JSON.stringify(a);if(nj!==lastJ)addSnap('pre-'+Date.now(),lastJ,'교체 전');lastJ=nj;replaced=true;S=a;TS=ts||Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(KEY+'_ts',TS)}catch(e){}resetForm();render()}
var SK='giftmgr_snaps';
function dayKey(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function snaps(){try{return JSON.parse(localStorage.getItem(SK))||[]}catch(e){return[]}}
function putSnaps(a){try{localStorage.setItem(SK,JSON.stringify(a))}catch(e){try{localStorage.setItem(SK,JSON.stringify(a.slice(-5)))}catch(e2){}}}
function addSnap(k,json,label){var a=snaps();a.push({k:k,ts:Date.now(),label:label,json:json});putSnaps(a.slice(-30))}
function snapBefore(){var k=dayKey();if(!snaps().some(function(x){return x.k===k}))addSnap(k,lastJ,'오늘 첫 변경 직전')}
var BKRE=/^mobilegift-\d{4}-\d{2}-\d{2}\.json$/,BKKEEP=14;
async function writeBackup(){
 if(!bk)return;
 try{
  var fh2=await bk.getFileHandle('mobilegift-'+dayKey()+'.json',{create:true}),w=await fh2.createWritable();
  await w.write(JSON.stringify({app:APP_ID,version:1,ts:TS,savedAt:new Date().toISOString(),lines:S},null,2));await w.close();
  var names=[];for await(var ent of bk.entries()){if(ent[1].kind==='file'&&BKRE.test(ent[0]))names.push(ent[0])}
  names.sort();while(names.length>BKKEEP){await bk.removeEntry(names.shift())}
  bkFail=false;try{localStorage.setItem(KEY+'_bk',Date.now())}catch(e){}
 }catch(e){bkFail=true}
 updBk()}
function updBk(){var b=document.getElementById('bBk');if(b)b.textContent='🗂 백업'+((bkPend||bkFail)?' ⚠':'')}
function parseData(t){try{var d=JSON.parse(t),a=Array.isArray(d)?d:d.lines;if(!Array.isArray(a)||!a.every(function(L){return L&&L.num&&Array.isArray(L.gifts)}))return null;return{a:a,ts:d.ts||0,id:!Array.isArray(d)&&d.app===APP_ID}}catch(e){return null}}
function idb(){return new Promise(function(res,rej){var r=indexedDB.open('giftmgr_fh',1);r.onupgradeneeded=function(){r.result.createObjectStore('h')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
async function idbPut(v,k){try{var d=await idb();d.transaction('h','readwrite').objectStore('h').put(v,k||'fh')}catch(e){}}
async function idbDel(k){try{var d=await idb();d.transaction('h','readwrite').objectStore('h').delete(k||'fh')}catch(e){}}
function idbGet(k){return idb().then(function(d){return new Promise(function(res){var q=d.transaction('h').objectStore('h').get(k||'fh');q.onsuccess=function(){res(q.result)};q.onerror=function(){res(null)}})}).catch(function(){return null})}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function won(n){return n.toLocaleString('ko-KR')+'원'}
function short(n){if(n>=10000&&n%10000===0)return n/10000+'만';if(n>=1000&&n%1000===0)return n/1000+'천';return n.toLocaleString('ko-KR')}
function idx(ym){var a=ym.split('-');return +a[0]*12+(+a[1])-1}
var view='open',ed=-1;
function today(){var d=new Date();return d.getFullYear()+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+('0'+d.getDate()).slice(-2)}
function st(L){var t=0,p=0;L.gifts.forEach(function(g){t+=g.a*g.n;p+=g.a*g.p.length});return{t:t,p:p}}
function pdt(v){var a=v.split('.');return new Date(+a[0],+a[1]-1,+a[2])}
function calc(fee,s,e){var sum=0,cur=s;while(cur<=e){var me=new Date(cur.getFullYear(),cur.getMonth()+1,0),se=me<e?me:e;var days=Math.round((se-cur)/864e5)+1;sum+=fee*days/me.getDate();cur=new Date(cur.getFullYear(),cur.getMonth()+1,1)}return sum}
function fees(L){
 if(!L.fee||!L.open)return null;
 var s=pdt(L.open),e=L.end?pdt(L.end):null,t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());
 var ne=(e&&e<t)?e:t;
 return{now:Math.round(calc(+L.fee,s,ne)),total:e?Math.round(calc(+L.fee,s,e)):null}}
function feeLine(L){
 var f=fees(L);if(!f)return '<div class="sm">요금: 월요금과 개통일을 입력하면 계산됩니다</div>';
 return '<div class="sm">요금(일할) 현재까지 <b>'+won(f.now)+'</b> · 총 예상 <b>'+(f.total==null?'해지일 미정':won(f.total))+'</b>'+(f.total==null?'':' · 남은 예상 '+won(f.total-f.now))+'</div>'}
function card(L,li){
 var gs=L.gifts,mn=1e9,mx=0,q=st(L),tot=q.t,pd=q.p,cl=!!L.closed;
 gs.forEach(function(g){var s=idx(g.s);mn=Math.min(mn,s);mx=Math.max(mx,s+g.n-1)});
 var th='<tr><th>사은품</th>';
 for(var m=mn;m<=mx;m++){var mo=m%12+1,y=Math.floor(m/12);th+='<th>'+((m===mn||mo===1)?'<small>'+y+'</small>':'<small>&nbsp;</small>')+mo+'월</th>'}
 th+='<th>합계</th></tr>';
 var rows='';
 gs.forEach(function(g,gi){
  var s=idx(g.s);
  rows+='<tr><td class="n">'+esc(g.t)+' <b>'+short(g.a)+'</b><small>'+esc(g.d)+' · '+g.n+'개월 · '+won(g.a*g.n)+'</small></td>';
  for(var m=mn;m<=mx;m++){var k=m-s;
   if(k<0||k>=g.n)rows+='<td class="x"></td>';
   else rows+='<td class="c'+(g.p.indexOf(k)>-1?' p':'')+'" data-l="'+li+'" data-g="'+gi+'" data-k="'+k+'">'+short(g.a)+'</td>'}
  rows+='<td>'+g.p.length+'/'+g.n+'</td></tr>'});
 var pc=tot?Math.round(pd/tot*100):0;
 var acts=cl?'<button data-edit="'+li+'">수정</button><button data-restore="'+li+'">운영 중으로 복구</button><button class="dng" data-purge="'+li+'">영구 삭제</button>'
  :'<button data-edit="'+li+'">수정</button><button class="dng" data-close="'+li+'">해지</button>';
 return '<div class="card"><div class="hd"><h2>'+esc(L.num)+' <span class="hint">'+esc(L.car)+'</span>'+(cl?'<span class="badge">해지 처리 '+esc(L.closed)+'</span>':'')+'</h2><div class="acts">'+acts+'</div></div>'
  +'<div class="meta"><span>기기 <b>'+esc(L.dev)+'</b></span><span>요금제 <b>'+esc(L.plan)+'</b></span><span>월요금 <b>'+(L.fee?won(+L.fee):'-')+'</b></span><span>개통일 <b>'+esc(L.open||'-')+'</b></span><span>해지일 <b>'+esc(L.end||'-')+'</b></span>'+(L.promo?'<span>프로모션 <b>'+esc(L.promo)+'</b></span>':'')+'</div>'
  +'<div class="bar"><i style="width:'+pc+'%"></i></div><div class="sm">지급 완료 '+won(pd)+' / 총 '+won(tot)+' ('+pc+'%) · '+(cl?'미수령':'남은 금액')+' '+won(tot-pd)+'</div>'
  +feeLine(L)+'<div class="sc"><table>'+th+rows+'</table></div><p class="hint" style="margin:6px 0 0">칸을 누르면 지급 완료(노란색) ↔ 미지급이 바뀝니다.</p></div>'}
function render(){
 var want=view==='closed',tp=0,tpd=0,n=0,h='',rowsum='',fn=0,ft=0,fr=0,unk=0;
 S.forEach(function(L,li){
  if(!!L.closed!==want)return;
  var q=st(L),f=fees(L);n++;tp+=q.t;tpd+=q.p;h+=card(L,li);if(f){fn+=f.now;if(f.total==null)unk++;else{ft+=f.total;fr+=f.total-f.now}}else unk++;
  rowsum+='<tr><td class="l">'+esc(L.num)+'</td><td>'+esc(L.car)+'</td><td>'+esc(L.open||'-')+'</td><td>'+esc(L.end||'-')+'</td><td>'+won(q.t)+'</td><td>'+won(q.p)+'</td><td>'+won(q.t-q.p)+'</td><td>'+(f?won(f.now):'-')+'</td><td>'+(f&&f.total!=null?won(f.total):'-')+'</td><td>'+(f&&f.total!=null?won(f.total-f.now):'-')+'</td></tr>'});
